<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forbidden Apple Tavern 本地预览</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #392321;
      background: #f4efe8;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 42px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 700;
    }

    h2 {
      margin: 28px 0 12px;
      font-size: 18px;
    }

    .shot {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 0 18px;
      border: 1px solid #d7c9bd;
      background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      align-items: start;
    }

    a {
      color: #7a1f2a;
    }
  </style>
</head>
<body>
  <main>
    <h1>禁果酒馆 Forbidden Apple Tavern 本地预览</h1>

    <h2>虚拟酒馆整体截图</h2>
    <a href="screenshots/virtual-tavern-catbox-desktop-fixed.png">
      <img class="shot" src="screenshots/virtual-tavern-catbox-desktop-fixed.png" alt="虚拟酒馆整体截图">
    </a>

    <div class="grid">
      <section>
        <h2>顶部抽屉图标近景</h2>
        <a href="screenshots/virtual-tavern-catbox-topbar-closeup.png">
          <img class="shot" src="screenshots/virtual-tavern-catbox-topbar-closeup.png" alt="顶部抽屉图标近景">
        </a>
      </section>

      <section>
        <h2>输入栏按钮近景</h2>
        <a href="screenshots/virtual-tavern-catbox-input-closeup.png">
          <img class="shot" src="screenshots/virtual-tavern-catbox-input-closeup.png" alt="输入栏按钮近景">
        </a>
      </section>
    </div>

    <h2>12 个素材拼图</h2>
    <a href="file:///C:/sta/SillyTavern/public/css/themes/forbidden-apple-tavern/drawer-icons/contact-sheet-final.png">
      <img class="shot" src="file:///C:/sta/SillyTavern/public/css/themes/forbidden-apple-tavern/drawer-icons/contact-sheet-final.png" alt="12 个素材拼图">
    </a>
  </main>
</body>
</html>
